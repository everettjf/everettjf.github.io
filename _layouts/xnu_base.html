<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0e0d0b" />
  {% seo %}
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
  <link rel="manifest" href="/images/site.webmanifest" />

  <!-- Precompiled Tailwind (sources in _build/, rebuild with `make assets`). -->
  <link rel="stylesheet" href="/assets/xnu/css/tailwind.css" />
  {% if page.layout == 'post' or page.layout == 'page' or page.layout == 'default' %}<link rel="stylesheet" href="/assets/xnu/css/blog.css" />{% endif %}

  <style>
    @font-face {
      font-family: 'Cascadia Code';
      src: url('/assets/fonts/cascadia-code-latin-wght-normal.woff2') format('woff2');
      font-weight: 200 700;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --background: 40 10% 5%;          /* warm near-black */
      --foreground: 48 17% 81%;         /* warm paper */
      --card: 45 10% 7%;
      --card-foreground: 48 17% 81%;
      --popover: 45 10% 7%;
      --popover-foreground: 48 17% 81%;
      --primary: 91 52% 61%;            /* terminal green */
      --primary-foreground: 40 10% 5%;
      --secondary: 45 11% 10%;
      --secondary-foreground: 48 17% 81%;
      --muted: 45 11% 10%;
      --muted-foreground: 42 11% 54%;
      --accent: 33 62% 58%;             /* warm amber */
      --accent-foreground: 40 10% 5%;
      --destructive: 7 61% 61%;
      --destructive-foreground: 40 10% 5%;
      --border: 45 11% 13%;
      --input: 45 11% 13%;
      --ring: 91 52% 61%;
      --radius: 0.15rem;
    }
    html { text-rendering: optimizeLegibility; }
    body { font-feature-settings: "rlig" 1, "calt" 1; }
    body { letter-spacing: -0.015em; }
    ::selection { background-color: rgba(153, 202, 103, 0.28); }
    a:active { color: hsl(var(--primary)); }
    a:focus-visible, button:focus-visible { outline: 1px solid hsl(var(--primary)); outline-offset: 4px; }
    .terminal-label { color: hsl(var(--primary)); font-size: .72rem; letter-spacing: .08em; }
    .terminal-label::before { content: "## "; }
    .terminal-panel { border: 1px solid hsl(var(--border)); background: hsl(var(--card)); }
    .terminal-cursor { display:inline-block; width:.55em; height:1em; margin-left:.12em; vertical-align:-.08em; background:hsl(var(--primary)); animation:blink 1.15s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .terminal-cursor { animation: none; } }
    .line-clamp-2 { overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .line-clamp-3 { overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
  </style>
</head>
<body class="bg-background text-foreground font-mono font-normal antialiased">
{% unless page.bare %}
  <div class="flex min-h-screen flex-col">
    {% include xnu/header.html %}
    <main class="flex-1">
      {{ content }}
    </main>
    {% include xnu/footer.html %}
  </div>
{% else %}
  {{ content }}
{% endunless %}

  <!-- Self-hosted subset of lucide icons (sources in _build/lucide-entry.js, rebuild with `make assets`). -->
  <script src="/assets/xnu/js/lucide-icons.min.js"></script>
  <script>
    (function () {
      function icons() { if (window.lucide) window.lucide.createIcons(); }
      icons();
      document.addEventListener('DOMContentLoaded', icons);

      // Copy-to-clipboard for install commands (mirrors the original brew buttons).
      window.__xnuCopy = function (btn) {
        var text = btn.getAttribute('data-copy') || '';
        var done = function () {
          var i = btn.querySelector('[data-copy-icon]');
          if (i) { i.setAttribute('data-lucide', 'check'); icons(); setTimeout(function () { i.setAttribute('data-lucide', 'copy'); icons(); }, 1500); }
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done).catch(function () {});
        } else {
          var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
          try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(ta); done();
        }
      };

      // Provider-neutral, cookie-free event layer. A future analytics provider can
      // consume `xnu:track`, `dataLayer`, or the Plausible-compatible calls below.
      window.__xnuTrack = function (name, props) {
        var payload = { event: name, props: props || {}, path: location.pathname };
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push(payload);
        document.documentElement.setAttribute('data-last-track', name);
        if (typeof window.plausible === 'function') window.plausible(name, { props: payload.props });
        document.dispatchEvent(new CustomEvent('xnu:track', { detail: payload }));
      };

      document.addEventListener('click', function (event) {
        var target = event.target.closest && event.target.closest('[data-track]');
        if (!target) return;
        var props = {};
        Array.prototype.forEach.call(target.attributes, function (attr) {
          if (attr.name.indexOf('data-track-') === 0) props[attr.name.slice(11)] = attr.value;
        });
        props.href = target.getAttribute('href') || '';
        window.__xnuTrack(target.getAttribute('data-track'), props);
      });
    })();
  </script>
</body>
</html>
