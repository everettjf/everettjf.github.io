<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1a1b26" />
  {% seo %}
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <link rel="shortcut icon" type="image/png" href="/images/favicon.png" />

  <!-- Precompiled Tailwind (sources in _build/, rebuild with `make assets`). -->
  <link rel="stylesheet" href="/assets/xnu/css/tailwind.css" />

  <style>
    @font-face {
      font-family: 'Cascadia Code';
      src: url('/assets/fonts/cascadia-code-latin-wght-normal.woff2') format('woff2');
      font-weight: 200 700;
      font-style: normal;
      font-display: swap;
    }
    :root {
      /* Tokyo Night (dark-only, omarchy.org-inspired) */
      --background: 235 19% 13%;        /* #1a1b26 */
      --foreground: 228 66% 91%;        /* #d8def7 brightened */
      --card: 229 26% 16%;              /* #1f2335 */
      --card-foreground: 228 66% 91%;
      --popover: 229 26% 16%;
      --popover-foreground: 228 66% 91%;
      --primary: 202 100% 75%;        /* #7dcfff cyan */
      --primary-foreground: 235 19% 13%;
      --secondary: 230 24% 19%;         /* #24283b */
      --secondary-foreground: 228 66% 91%;
      --muted: 230 24% 19%;
      --muted-foreground: 229 35% 75%;  /* #a9b1d6 brightened */
      --accent: 230 24% 19%;
      --accent-foreground: 202 100% 75%;/* #7dcfff cyan on hover surfaces */
      --destructive: 349 89% 72%;       /* #f7768e */
      --destructive-foreground: 235 19% 13%;
      --border: 229 23% 24%;
      --input: 229 23% 24%;
      --ring: 202 100% 75%;
      --radius: 0.5rem;
    }
    html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    body { font-feature-settings: "rlig" 1, "calt" 1; }
    ::selection { background-color: rgba(125, 207, 255, 0.25); }
    a:active { color: hsl(var(--primary)); }
    .line-clamp-2 { overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .line-clamp-3 { overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }
  </style>
</head>
<body class="bg-background text-foreground font-sans antialiased">
{% unless page.bare %}
  <div class="flex min-h-screen flex-col">
    {% include xnu/header.html %}
    <main class="flex-1">
      {{ content }}
    </main>
    {% include xnu/footer.html %}
  </div>
{% else %}
  {{ content }}
{% endunless %}

  <!-- Self-hosted subset of lucide icons (sources in _build/lucide-entry.js, rebuild with `make assets`). -->
  <script src="/assets/xnu/js/lucide-icons.min.js"></script>
  <script>
    (function () {
      function icons() { if (window.lucide) window.lucide.createIcons(); }
      icons();
      document.addEventListener('DOMContentLoaded', icons);

      // Copy-to-clipboard for install commands (mirrors the original brew buttons).
      window.__xnuCopy = function (btn) {
        var text = btn.getAttribute('data-copy') || '';
        var done = function () {
          var i = btn.querySelector('[data-copy-icon]');
          if (i) { i.setAttribute('data-lucide', 'check'); icons(); setTimeout(function () { i.setAttribute('data-lucide', 'copy'); icons(); }, 1500); }
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done).catch(function () {});
        } else {
          var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
          try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(ta); done();
        }
      };
    })();
  </script>
</body>
</html>
