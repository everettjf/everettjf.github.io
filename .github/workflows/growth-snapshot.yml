name: Growth snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 16 * * 1"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update public GitHub metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/update-growth-snapshot.sh
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- _data/growth.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/growth.json
          git commit -m "Update weekly growth snapshot"
          git push
