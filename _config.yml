name: Everett
title: Everett — personal blog
description: Building software, exploring how things work, and lessons from work and life.
meta_description: "Everett’s personal blog — building software, exploring technical details, and reflecting on work and life."
company_url: https://atomsprout.com

markdown: kramdown
highlighter: rouge
baseurl: ''
domain_name: 'https://xnu.app'

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Details for the RSS feed generator and SEO tags
url:            'https://xnu.app'
author:         'Everett'
authorimage: /images/android-chrome-512x512.png
logo:           /images/android-chrome-512x512.png

permalink: /:year/:month/:day/:title/
location: 'Cupertino, CA'
excerpt_separator:  '<!-- more -->'

# Default Open Graph image for pages without their own
defaults:
  - scope:
      path: ""
    values:
      image: /images/android-chrome-512x512.png

# Keep sitemap from indexing build/repo noise
exclude:
  - Gemfile
  - Gemfile.lock
  - Rakefile
  - Makefile
  - README.md
  - LICENSE.txt
  - new.sh
  - push.sh
  - serve.sh
